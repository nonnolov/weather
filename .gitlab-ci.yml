# GitLab CI — Phase 1
# job 'test'      — unit tests, in-memory SQLite, no network required
# job 'integrate' — real Open-Meteo API + PostgreSQL service container

default:
  image: python:3.12-slim

stages:
  - test
  - integrate

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "pip-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

# ── Unit tests (SQLite in-memory, no network) ──────────────────────────────────────
test:
  stage: test
  variables:
    DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    DATABASE_URL_SYNC: "sqlite:///:memory:"
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet -r requirements.txt
  script:
    - pytest -q -m "not integration"
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ── Integration tests (real PostgreSQL + real Open-Meteo API) ─────────────────────
integrate:
  stage: integrate
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: weather_test
    POSTGRES_USER: weather
    POSTGRES_PASSWORD: weather
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgresql+asyncpg://weather:weather@postgres:5432/weather_test"
    DATABASE_URL_SYNC: "postgresql+psycopg2://weather:weather@postgres:5432/weather_test"
    DEBUG: "false"
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet -r requirements.txt
    - python scripts/wait_for_postgres.py
    - alembic upgrade head
  script:
    - pytest -m integration -v -s tests/integration/
